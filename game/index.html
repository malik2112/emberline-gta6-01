<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERLINE — Open-World Crime at Sunset</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1226; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f5ead9; z-index: 5; }
  #hud-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  #stars { font-size: 30px; letter-spacing: 4px; color: #cfc4b8; text-shadow: 0 2px 6px #000; }
  #cash { font-size: 26px; font-weight: 700; color: #7ee2a0; text-shadow: 0 2px 6px #000; }
  #hud-bl { position: absolute; left: 16px; bottom: 16px; }
  #health-wrap { width: 210px; height: 14px; background: rgba(0,0,0,.55); border: 1px solid #000; border-radius: 3px; overflow: hidden; }
  #health-bar { height: 100%; width: 100%; background: #3aa655; }
  #health-text, #ammo { font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px #000; margin-top: 4px; }
  #hud-br { position: absolute; right: 16px; bottom: 16px; }
  #minimap { border: 2px solid rgba(255,255,255,.35); border-radius: 50%; background: #241d2e; box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #hud-ml { position: absolute; left: 16px; top: 64px; max-width: 340px; }
  #mission { font-size: 18px; font-weight: 800; color: #ffb020; text-shadow: 0 2px 6px #000; }
  #objective { font-size: 15px; margin-top: 4px; text-shadow: 0 1px 4px #000; }
  #feed { margin-top: 10px; font-size: 13px; }
  #feed div { background: rgba(0,0,0,.5); padding: 3px 8px; margin-top: 4px; border-left: 3px solid #ff7a3c; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #ffd27a; text-shadow: 0 3px 10px #000; text-align: center; white-space: nowrap; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px #000; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(26,18,38,.25) 0%, rgba(26,18,38,.82) 78%); color: #f5ead9; z-index: 10; text-align: center; }
  #menu-title { font-size: 72px; font-weight: 900; letter-spacing: 10px; color: #ff7a3c; text-shadow: 0 4px 0 #7a2a12, 0 8px 24px #000; margin: 0; }
  #menu-sub { font-size: 17px; max-width: 520px; margin: 14px 0 26px; text-shadow: 0 1px 6px #000; }
  #menu-btn { pointer-events: auto; cursor: pointer; font-size: 20px; font-weight: 700; padding: 14px 34px; border: none; border-radius: 4px; background: #ff7a3c; color: #1a1226; box-shadow: 0 4px 0 #a03d12; }
  #menu-btn:active { transform: translateY(3px); box-shadow: none; }
  #menu-keys { margin-top: 22px; font-size: 13px; opacity: .85; }
  #boot-error { position: fixed; left: 12px; bottom: 12px; color: #ff6b5e; z-index: 20; font: 13px monospace; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="menu">
  <h1 id="menu-title">EMBERLINE</h1>
  <p id="menu-sub">Open-world crime at sunset — steal, drive, survive the harbour.</p>
  <button id="menu-btn">▶&nbsp; START ENGINE</button>
  <div id="menu-keys">WASD move &nbsp;·&nbsp; E enter / exit car &nbsp;·&nbsp; Click shoot &nbsp;·&nbsp; R reload &nbsp;·&nbsp; Q radio &nbsp;·&nbsp; P pause</div>
</div>
<div id="boot-error"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
